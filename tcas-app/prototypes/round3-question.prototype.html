<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>TCAS · รอบ 3 — การ์ดโจทย์ + ตัวเลือก + จังหวะตรวจคำตอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Paper & Pencil tokens (ล็อกจากรอบ 1) ───────────────────── */
:root{
  --paper:#FAF7F0; --paper-2:#F3EEE2; --paper-3:#EAE3D2;
  --ink:#2B2A26; --ink-2:#6E675A; --ink-3:#9C9483;
  --pen:#27567F; --pen-soft:#E3EDF6;
  --mark:#FFE486; --ruled:#DCE4EC;
  --right:#2E7A50; --right-soft:#E4F1E8;
  --wrong:#B2453B; --wrong-soft:#F8E6E3;
  --warm:#F0A030; --warm-soft:#FDF0DC;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(43,42,38,.06), 0 8px 24px -12px rgba(43,42,38,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Sarabun',system-ui,sans-serif;
  background:#DFD9CC; color:var(--ink);
  display:flex; align-items:flex-start; justify-content:center;
  padding:26px 16px 120px;
}

/* ── กรอบอุปกรณ์ ─────────────────────────────────────────────── */
.frame{
  width:var(--dev,390px); height:800px; max-height:calc(100vh - 60px);
  background:var(--paper); border-radius:22px; overflow-y:auto; overflow-x:hidden;
  position:relative; box-shadow:0 24px 60px -20px rgba(0,0,0,.35);
  border:1px solid rgba(43,42,38,.12); scrollbar-width:thin;
}
.screen{min-height:100%; display:flex; flex-direction:column}

/* ── เปลือกแอป ───────────────────────────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(250,247,240,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--paper-3);
  padding:12px 16px; display:flex; align-items:center; gap:10px;
}
.brand{font-weight:700; letter-spacing:-.2px}
.brand small{color:var(--ink-3); font-weight:500}
.spacer{flex:1}
.quota{
  font-size:12.5px; color:var(--pen); background:var(--pen-soft);
  padding:4px 10px; border-radius:999px; font-weight:600; white-space:nowrap;
}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--paper-3);
  display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}

/* หัวโหมดโฟกัส — ไม่มีเมนู เหลือ progress + ออก */
.focusbar{
  position:sticky; top:0; z-index:20; background:rgba(250,247,240,.94);
  backdrop-filter:blur(8px); padding:12px 16px 10px;
  border-bottom:1px solid var(--paper-3);
}
.focusrow{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.focusrow .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.focusrow .timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.xbtn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--paper-3);
  background:transparent;color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;
}
.track{height:5px;background:var(--paper-3);border-radius:999px;overflow:hidden}
.track > i{display:block;height:100%;background:var(--pen);border-radius:999px}

/* แท็บล่าง — โผล่เฉพาะหน้าที่ไม่ใช่โหมดโฟกัส */
.tabs{
  position:sticky; bottom:0; z-index:20; margin-top:auto;
  background:rgba(250,247,240,.96); backdrop-filter:blur(8px);
  border-top:1px solid var(--paper-3); display:grid; grid-template-columns:repeat(4,1fr);
  padding:6px 4px 8px;
}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:5px 2px;color:var(--ink-3);font-size:11px;font-family:inherit}
.tab .ic{font-size:17px;line-height:1}
.tab.on{color:var(--pen);font-weight:600}

main{flex:1; padding:16px; display:flex; flex-direction:column; gap:14px}

/* ── การ์ดโจทย์ ─────────────────────────────────────────────── */
.card{
  background:#fff; border:1px solid var(--paper-3); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px 16px;
}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--paper-2);
  color:var(--ink-2);font-weight:500}
.pill.lv{background:var(--mark);color:#5A4A10;font-weight:600}
.qtext{font-size:17px;line-height:1.62;font-weight:500}
.qtext .fx{font-family:'Cambria Math',Georgia,serif;font-style:italic;font-size:1.06em;padding:0 2px}

/* ── ตัวเลือก: 5 ทรง ───────────────────────────────────────── */
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.ch{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  font-family:inherit;font-size:15.5px;line-height:1.5;color:var(--ink);
  background:#fff;border:1.5px solid var(--paper-3);border-radius:var(--r-sm);
  padding:12px 14px;cursor:pointer;transition:.14s;
}
.ch:hover{border-color:var(--ink-3)}
.ch .k{flex:none;font-weight:600;color:var(--ink-2)}
.ch .tx{flex:1}

/* A · OMR — วงกลมฝนคำตอบแบบกระดาษคำตอบ */
[data-v="omr"] .choices{gap:2px;margin-top:14px}
[data-v="omr"] .ch{border:0;border-bottom:1px dashed var(--ruled);border-radius:0;
  padding:11px 4px;background:transparent}
[data-v="omr"] .ch:last-child{border-bottom:0}
[data-v="omr"] .ch .k{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);
  display:grid;place-items:center;font-size:13px;color:var(--ink-3);transition:.14s;
}
[data-v="omr"] .ch.sel .k{background:var(--pen);border-color:var(--pen);color:#fff}
[data-v="omr"] .ch.sel .tx{font-weight:600}

/* B · ปุ่มเต็มความกว้าง + ป้ายอักษรสี่เหลี่ยม */
[data-v="btn"] .ch{padding:14px}
[data-v="btn"] .ch .k{
  width:26px;height:26px;border-radius:7px;background:var(--paper-2);
  display:grid;place-items:center;font-size:13px;
}
[data-v="btn"] .ch.sel{border-color:var(--pen);background:var(--pen-soft)}
[data-v="btn"] .ch.sel .k{background:var(--pen);color:#fff}

/* C · กริด 2 คอลัมน์ (พับเป็น 1 คอลัมน์เมื่อคำตอบยาว) */
[data-v="grid"] .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
[data-v="grid"][data-len="long"] .choices{grid-template-columns:1fr}
[data-v="grid"] .ch{flex-direction:column;align-items:flex-start;gap:6px;padding:13px 14px}
[data-v="grid"][data-len="long"] .ch{flex-direction:row;align-items:center;gap:12px}
[data-v="grid"] .ch .k{font-size:11.5px;color:var(--ink-3)}
[data-v="grid"] .ch .tx{font-size:16.5px;font-weight:500}
[data-v="grid"] .ch.sel{border-color:var(--pen);background:var(--pen-soft)}

/* D · เลือกก่อน แล้วกดตรวจ */
[data-v="two"] .ch.sel{border-color:var(--pen);border-width:2px;background:var(--pen-soft)}
[data-v="two"] .ch .k{width:24px}

/* E · ตอบปุ๊บเฉลยปั๊บ + sheet แนวคิด */
[data-v="fast"] .ch{padding:13px 14px}
[data-v="fast"] .ch.sel{border-color:var(--ink-2)}

/* สถานะเฉลยร่วม */
.ch.ok{border-color:var(--right);background:var(--right-soft)}
.ch.ok .k{background:var(--right)!important;border-color:var(--right)!important;color:#fff!important}
.ch.no{border-color:var(--wrong);background:var(--wrong-soft)}
.ch.no .k{background:var(--wrong)!important;border-color:var(--wrong)!important;color:#fff!important}
.ch.dim{opacity:.42}
.ch .tag{margin-left:auto;font-size:11.5px;font-weight:600;flex:none}
.ch.ok .tag{color:var(--right)} .ch.no .tag{color:var(--wrong)}

/* ── ปุ่ม ────────────────────────────────────────────────────── */
.btn{
  font-family:inherit;font-size:15px;font-weight:600;border-radius:var(--r-sm);
  padding:13px 18px;cursor:pointer;border:1.5px solid transparent;transition:.14s;
}
.btn.primary{background:var(--pen);color:#fff}
.btn.primary:disabled{background:var(--paper-3);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--paper-3);color:var(--ink-2)}
.btn.full{width:100%}

/* ── พื้นผิวเฉลย ────────────────────────────────────────────── */
.fbbar{
  position:sticky;bottom:0;z-index:15;margin:auto -16px -16px;padding:13px 16px 16px;
  background:rgba(250,247,240,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--paper-3);display:flex;align-items:center;gap:12px;
}
.fbbar .verdict{font-weight:700;font-size:15px}
.fbbar .verdict.ok{color:var(--right)} .fbbar .verdict.no{color:var(--wrong)}
.fbbar .sub{font-size:12.5px;color:var(--ink-2)}

.fbcard{
  border-radius:var(--r);padding:15px 16px;margin-top:14px;
  border:1px solid var(--paper-3);background:var(--paper-2);
}
.fbcard.ok{background:var(--right-soft);border-color:#C6E2CF}
.fbcard.no{background:var(--wrong-soft);border-color:#EFCEC9}
.fbcard h4{font-size:14.5px;margin-bottom:6px}
.fbcard p{font-size:14px;line-height:1.66;color:var(--ink-2)}

.sheet{
  position:sticky;bottom:0;z-index:15;margin:14px -16px -16px;
  background:#fff;border-top:1px solid var(--paper-3);
  border-radius:18px 18px 0 0;padding:10px 16px 16px;
  box-shadow:0 -10px 30px -14px rgba(43,42,38,.28);
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grabber{width:38px;height:4px;border-radius:999px;background:var(--paper-3);margin:0 auto 12px}

.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:2px}

/* ── หน้าหลัก (โชว์แท็บ) ────────────────────────────────────── */
.hero{background:var(--paper-2);border:1px solid var(--paper-3);border-radius:var(--r);padding:18px 16px}
.hero h2{font-size:19px;margin-bottom:5px}
.hero p{font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:14px}
.rowcards{display:grid;gap:11px}
.rowcard{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--paper-3);
  border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.rowcard .ic{width:38px;height:38px;border-radius:11px;background:var(--paper-2);
  display:grid;place-items:center;font-size:18px;flex:none}
.rowcard b{display:block;font-size:15px;margin-bottom:2px}
.rowcard span{font-size:12.5px;color:var(--ink-3)}
.sec{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;margin:4px 0 -4px}

/* ── ตัวเลือกดีไซน์ (ลอยมุมขวาล่าง ลากได้) ─────────────────── */
#picker{
  position:fixed;right:18px;bottom:18px;z-index:999;width:296px;
  background:#25231F;color:#EDE8DE;border-radius:14px;padding:12px 13px 13px;
  box-shadow:0 20px 50px -12px rgba(0,0,0,.55);font-size:12.5px;user-select:none;
}
#picker .head{display:flex;align-items:center;gap:8px;cursor:grab;margin-bottom:10px}
#picker .head b{font-size:13px;flex:1}
#picker .arrow{width:26px;height:26px;border-radius:7px;border:1px solid #4A463E;
  background:#332F29;color:#EDE8DE;cursor:pointer;font-size:13px;line-height:1}
#picker .name{font-size:14.5px;font-weight:700;margin-bottom:3px}
#picker .desc{color:#A79F91;line-height:1.55;margin-bottom:11px;font-size:11.8px;min-height:34px}
#picker .row{margin-bottom:9px}
#picker .row > label{display:block;color:#8E877B;font-size:10.5px;letter-spacing:.5px;margin-bottom:5px}
#picker .chips{display:flex;flex-wrap:wrap;gap:5px}
#picker .chip{
  border:1px solid #45413A;background:#332F29;color:#CFC8BB;border-radius:7px;
  padding:5px 9px;cursor:pointer;font-family:inherit;font-size:11.5px;
}
#picker .chip.on{background:#EDE8DE;color:#25231F;border-color:#EDE8DE;font-weight:600}
#picker .chip:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body data-v="omr" data-len="short" data-page="practice" data-st="idle" style="--dev:390px">

<div class="frame"><div class="screen" id="app"></div></div>

<div id="picker">
  <div class="head" id="drag">
    <b>รอบ 3 · การ์ดโจทย์</b>
    <button class="arrow" onclick="cycle(-1)">←</button>
    <button class="arrow" onclick="cycle(1)">→</button>
  </div>
  <div class="name" id="pName"></div>
  <div class="desc" id="pDesc"></div>
  <div class="row"><label>ดีไซน์</label><div class="chips" id="cV"></div></div>
  <div class="row"><label>หน้าจอ</label><div class="chips" id="cP"></div></div>
  <div class="row"><label>สถานะ</label><div class="chips" id="cS"></div></div>
  <div class="row"><label>ความยาวโจทย์</label><div class="chips" id="cL"></div></div>
  <div class="row" style="margin-bottom:0"><label>อุปกรณ์</label><div class="chips" id="cD"></div></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   โครงที่ล็อกแล้ว (รอบ 2): การ์ด + แท็บล่าง, ระหว่างทำโจทย์/mock ไม่มีเมนู
   รอบ 3 ต่างกันที่: ทรงตัวเลือก · จังหวะตรวจคำตอบ · พื้นผิวเฉลย · ข้อความ
   ════════════════════════════════════════════════════════════ */

const VARIANTS = [
  { id:'omr',  name:'A · ฝนวงกลม',
    desc:'ตัวเลือกเป็นวงกลม ก–จ บนเส้นประแบบกระดาษคำตอบ · แตะแล้วตรวจทันที · เฉลยเป็นแถบล่างติดขอบจอ' },
  { id:'btn',  name:'B · ปุ่มเต็มบรรทัด',
    desc:'ตัวเลือกเป็นปุ่มมีกรอบเต็มความกว้าง อ่านง่ายสุดบนมือถือ · แตะแล้วตรวจทันที · เฉลยเป็นแถบล่าง' },
  { id:'grid', name:'C · กริด 2 ช่อง',
    desc:'คำตอบสั้นเรียง 2 คอลัมน์ให้เห็นครบไม่ต้องเลื่อน · พับเป็นคอลัมน์เดียวเองเมื่อคำตอบยาว' },
  { id:'two',  name:'D · เลือกก่อน–ตรวจทีหลัง',
    desc:'แตะเลือกได้ เปลี่ยนใจได้ แล้วค่อยกด "ตรวจคำตอบ" · เฉลยแทรกเป็นการ์ดในหน้า พร้อมแนวคิด' },
  { id:'fast', name:'E · เฉลยเด้ง bottom sheet',
    desc:'แตะปุ๊บเฉลยเด้งจากขอบล่างทันที พร้อมวิธีคิดย่อ · เน้นเรียนรู้ต่อข้อมากกว่าทำเร็ว' },
];

const PAGES = [
  { id:'practice', label:'ฝึกโจทย์', focus:true  },
  { id:'mock',     label:'Mock',     focus:true  },
  { id:'home',     label:'หน้าหลัก', focus:false },
];

const STATES = [
  ['idle',  'ยังไม่ตอบ'],
  ['picked','เลือกแล้ว'],
  ['right', 'ตอบถูก'],
  ['wrong', 'ตอบผิด'],
];
const LENS = [['short','สั้น'],['long','ยาว + สูตร']];
const DEVS = [['390px','มือถือ 390'],['834px','iPad 834'],['1200px','Desktop']];

/* ── ข้อความ: BASE + override ต่อดีไซน์ ────────────────────── */
const BASE = {
  brand:'TCAS Practice',
  quota:'เหลือวันนี้ 7 ข้อ',
  focusLbl:'ข้อ 4 จาก 10',
  mockLbl:'ข้อ 12 จาก 30',
  submit:'ตรวจคำตอบ',
  next:'ข้อถัดไป',
  nextMock:'ข้อถัดไป',
  okTitle:'ตอบถูก',
  noTitle:'ตอบผิด',
  okSub:'คำตอบที่ถูกคือ {A}',
  noSub:'คำตอบที่ถูกคือ {A}',
  ideaTitle:'แนวคิด',
  hint:'แตะที่ตัวเลือกเพื่อตอบ',
  homeH:'สวัสดีค่ะ',
  homeP:'วันนี้ยังไม่ได้ฝึก แนะนำให้เริ่มจากพีชคณิตซึ่งเป็นหัวข้อที่ยังทำได้ไม่คงที่',
};
const COPY = {
  omr:  { hint:'ฝนวงกลมหน้าตัวเลือกที่ต้องการ' },
  btn:  { hint:'เลือกคำตอบที่ถูกต้องที่สุด' },
  grid: { hint:'เลือกคำตอบที่ถูกต้องที่สุด' },
  two:  { hint:'เลือกคำตอบ แล้วกดตรวจ',
          okSub:'ตรงกับเฉลย {A}', noSub:'เฉลยคือ {A}' },
  fast: { hint:'แตะเพื่อดูเฉลยทันที',
          okTitle:'ถูกต้อง', noTitle:'ยังไม่ใช่',
          okSub:'เข้าใจหลักการนี้แล้ว', noSub:'ลองดูวิธีคิดด้านล่าง' },
};
const T = k => String((COPY[S.v]||{})[k] ?? BASE[k])
  .replace('{A}', K[Q[S.len].ans]);
const IDEA = () => Q[S.len].idea;

/* ── ข้อมูลโจทย์ ────────────────────────────────────────────── */
const Q = {
  short:{
    topic:'พีชคณิต', lv:'ระดับ 3',
    text:'ถ้า <span class="fx">3x + 7 = 25</span> แล้ว <span class="fx">x</span> มีค่าเท่าใด',
    ch:['4','6','8','10','12'], ans:1,
    idea:'ย้ายค่าคงที่ไปอีกข้างก่อน แล้วจึงหารด้วยสัมประสิทธิ์ของตัวแปร จะได้ 3x = 25 − 7 = 18 ดังนั้น x = 6',
  },
  long:{
    topic:'ฟังก์ชัน', lv:'ระดับ 5',
    text:'กำหนดให้ <span class="fx">f(x) = −x² + 4x + 1</span> ข้อความใดกล่าวถึงพฤติกรรมของ <span class="fx">f</span> ได้ถูกต้อง',
    ch:[
      'f เพิ่มขึ้นบนช่วง (−∞, 2) และลดลงบนช่วง (2, ∞) โดยมีค่าสูงสุดเท่ากับ 5',
      'f ลดลงบนช่วง (−∞, 2) และเพิ่มขึ้นบนช่วง (2, ∞) โดยมีค่าต่ำสุดเท่ากับ 5',
      'f เพิ่มขึ้นตลอดโดเมน เนื่องจากสัมประสิทธิ์ของพจน์กำลังสองเป็นลบ',
      'f มีค่าสูงสุดที่ x = 4 และค่าสูงสุดนั้นเท่ากับ 1',
      'f ไม่มีทั้งค่าสูงสุดและค่าต่ำสุด เนื่องจากโดเมนเป็นจำนวนจริง',
    ], ans:0,
    idea:'สัมประสิทธิ์ของ x² เป็นลบ กราฟจึงคว่ำและมีค่าสูงสุดที่จุดยอด จุดยอดอยู่ที่ x = −b/2a = 2 แทนกลับได้ f(2) = 5',
  },
};
const K = ['ก','ข','ค','ง','จ'];

const S = { v:'omr', page:'practice', st:'idle', len:'short', dev:'390px' };

/* ── ชิ้นส่วนหน้าจอ ─────────────────────────────────────────── */
function topbar(){
  return `<div class="topbar">
    <div class="brand">TCAS <small>Practice</small></div>
    <div class="spacer"></div>
    <div class="quota">${T('quota')}</div>
    <div class="avatar">ZN</div>
  </div>`;
}
function focusbar(pct, lbl, timer){
  return `<div class="focusbar">
    <div class="focusrow">
      <button class="xbtn">✕</button>
      <span class="lbl">${lbl}</span>
      <div class="spacer"></div>
      ${timer ? `<span class="timer">${timer}</span>` : ''}
    </div>
    <div class="track"><i style="width:${pct}%"></i></div>
  </div>`;
}
function tabs(active){
  const items = [['ic-h','หน้าหลัก','home'],['ic-p','ฝึกโจทย์','practice'],
                 ['ic-s','สนามสอบ','social'],['ic-a','บัญชี','account']];
  const ics = {'ic-h':'▤','ic-p':'✎','ic-s':'⚑','ic-a':'◍'};
  return `<div class="tabs">${items.map(([i,l,id])=>
    `<button class="tab${id===active?' on':''}"><span class="ic">${ics[i]}</span>${l}</button>`
  ).join('')}</div>`;
}

/* ตัวเลือก — คลาสเปลี่ยนตามสถานะ */
function choices(){
  const q = Q[S.len], picked = 3;           // ผู้ใช้เลือก "ง" ในสถานะ picked/wrong
  return `<div class="choices">${q.ch.map((t,i)=>{
    let cls='ch', tag='';
    if(S.st==='picked' && i===picked) cls+=' sel';
    if(S.st==='right'){
      if(i===q.ans){ cls+=' ok'; tag='<span class="tag">คำตอบของคุณ</span>'; }
      else cls+=' dim';
    }
    if(S.st==='wrong'){
      if(i===picked){ cls+=' no'; tag='<span class="tag">คำตอบของคุณ</span>'; }
      else if(i===q.ans){ cls+=' ok'; tag='<span class="tag">เฉลย</span>'; }
      else cls+=' dim';
    }
    return `<button class="${cls}"><span class="k">${K[i]}</span><span class="tx">${t}</span>${tag}</button>`;
  }).join('')}</div>`;
}

/* พื้นผิวเฉลย — ต่างกันตามดีไซน์ */
function feedback(){
  if(S.st!=='right' && S.st!=='wrong') return '';
  const ok = S.st==='right';
  const v = S.v;

  if(v==='two'){
    return `<div class="fbcard ${ok?'ok':'no'}">
      <h4>${ok?T('okTitle'):T('noTitle')} · ${ok?T('okSub'):T('noSub')}</h4>
      <p><b>${T('ideaTitle')}</b> — ${IDEA()}</p>
    </div>
    <button class="btn primary full" style="margin-top:12px">${T('next')}</button>`;
  }
  if(v==='fast'){
    return `<div class="sheet">
      <div class="grabber"></div>
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:7px">
        <span class="verdict ${ok?'ok':'no'}" style="font-weight:700;font-size:16px;color:${ok?'var(--right)':'var(--wrong)'}">${ok?T('okTitle'):T('noTitle')}</span>
        <span class="sub" style="font-size:12.5px;color:var(--ink-2)">${ok?T('okSub'):T('noSub')}</span>
      </div>
      <p style="font-size:14px;line-height:1.66;color:var(--ink-2);margin-bottom:13px">
        <b style="color:var(--ink)">${T('ideaTitle')}</b> — ${IDEA()}</p>
      <button class="btn primary full">${T('next')}</button>
    </div>`;
  }
  /* A / B / C — แถบล่างติดขอบจอ */
  return `<div class="fbbar">
    <div>
      <div class="verdict ${ok?'ok':'no'}">${ok?T('okTitle'):T('noTitle')}</div>
      <div class="sub">${ok?T('okSub'):T('noSub')}</div>
    </div>
    <div class="spacer" style="flex:1"></div>
    <button class="btn primary">${T('next')}</button>
  </div>`;
}

/* ── หน้าจอ ─────────────────────────────────────────────────── */
const R = {
  practice(){
    const q = Q[S.len];
    const showSubmit = S.v==='two' && (S.st==='idle' || S.st==='picked');
    return focusbar(40, T('focusLbl'), '') + `<main>
      <div class="card">
        <div class="qmeta">
          <span class="pill">${q.topic}</span>
          <span class="pill lv">${q.lv}</span>
        </div>
        <div class="qtext">${q.text}</div>
        ${choices()}
        ${S.st==='idle' && !showSubmit ? `<div class="hint">${T('hint')}</div>` : ''}
        ${showSubmit ? `<button class="btn primary full" style="margin-top:14px" ${S.st==='idle'?'disabled':''}>${T('submit')}</button>` : ''}
        ${S.v==='two' ? feedback() : ''}
      </div>
      ${S.v!=='two' ? feedback() : ''}
    </main>`;
  },
  mock(){
    const q = Q[S.len];
    return focusbar(40, T('mockLbl'), '58:12') + `<main>
      <div class="card">
        <div class="qmeta"><span class="pill">${q.topic}</span></div>
        <div class="qtext">${q.text}</div>
        ${(()=>{ const keep=S.st; S.st = (keep==='idle')?'idle':'picked';
                 const h=choices(); S.st=keep; return h; })()}
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" style="flex:none">ก่อนหน้า</button>
        <button class="btn primary" style="flex:1">${T('nextMock')}</button>
      </div>
      <div class="hint">ระหว่างสอบจะยังไม่แสดงเฉลย</div>
    </main>`;
  },
  home(){
    return topbar() + `<main>
      <div class="hero">
        <h2>${T('homeH')}</h2>
        <p>${T('homeP')}</p>
        <button class="btn primary">เริ่มฝึกโจทย์</button>
      </div>
      <div class="sec">ทำต่อ</div>
      <div class="rowcards">
        <div class="rowcard"><div class="ic">✎</div><div><b>พีชคณิต · ระดับ 3</b><span>ทำไปแล้ว 24 ข้อ · ถูก 71%</span></div></div>
        <div class="rowcard"><div class="ic">⧗</div><div><b>Mock ค้างอยู่</b><span>เหลืออีก 18 ข้อ · หมดเวลาใน 58 นาที</span></div></div>
        <div class="rowcard"><div class="ic">⚑</div><div><b>สนามสอบ · ห้อง 4KQ2ZP</b><span>เพื่อนอยู่ในห้อง 3 คน</span></div></div>
      </div>
    </main>` + tabs('home');
  },
};

/* ── เรนเดอร์ + ตัวเลือกดีไซน์ ─────────────────────────────── */
function render(){
  const b = document.body;
  b.dataset.v = S.v; b.dataset.len = S.len; b.dataset.page = S.page; b.dataset.st = S.st;
  b.style.setProperty('--dev', S.dev);
  document.getElementById('app').innerHTML = R[S.page]();
  document.querySelector('.frame').scrollTop = 0;
  paintPicker();
}
function chips(el, list, cur, fn, dis){
  el.innerHTML = list.map(([v,l])=>
    `<button class="chip${v===cur?' on':''}" ${dis&&dis(v)?'disabled':''} data-v="${v}">${l}</button>`).join('');
  [...el.children].forEach(c=>c.onclick=()=>{ fn(c.dataset.v); render(); });
}
function paintPicker(){
  const v = VARIANTS.find(x=>x.id===S.v);
  document.getElementById('pName').textContent = v.name;
  document.getElementById('pDesc').textContent = v.desc;
  chips(cV, VARIANTS.map(x=>[x.id,x.name.split(' · ')[0]]), S.v, x=>S.v=x);
  chips(cP, PAGES.map(p=>[p.id,p.label]), S.page, x=>S.page=x);
  chips(cS, STATES, S.st, x=>S.st=x, x=> x==='picked' && S.v!=='two');
  chips(cL, LENS, S.len, x=>S.len=x);
  chips(cD, DEVS, S.dev, x=>S.dev=x);
}
function cycle(d){
  const i = VARIANTS.findIndex(x=>x.id===S.v);
  S.v = VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].id;
  if(S.st==='picked' && S.v!=='two') S.st='idle';
  render();
}
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') cycle(1);
  if(e.key==='ArrowLeft')  cycle(-1);
});
/* ลากตัวเลือกดีไซน์ได้ */
(function(){
  const p = document.getElementById('picker'), h = document.getElementById('drag');
  let dx=0, dy=0, on=false;
  h.onmousedown = e=>{ on=true; const r=p.getBoundingClientRect();
    dx=e.clientX-r.left; dy=e.clientY-r.top; h.style.cursor='grabbing'; };
  addEventListener('mousemove', e=>{ if(!on) return;
    p.style.left=(e.clientX-dx)+'px'; p.style.top=(e.clientY-dy)+'px';
    p.style.right='auto'; p.style.bottom='auto'; });
  addEventListener('mouseup', ()=>{ on=false; h.style.cursor='grab'; });
})();
render();
</script>
</body>
</html>
