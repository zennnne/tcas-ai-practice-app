<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>TCAS · รอบ 4 — เส้นทาง Mock + สนามสอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Paper & Pencil tokens (ล็อกรอบ 1) ─────────────────────── */
:root{
  --paper:#FAF7F0; --paper-2:#F3EEE2; --paper-3:#EAE3D2;
  --ink:#2B2A26; --ink-2:#6E675A; --ink-3:#9C9483;
  --pen:#27567F; --pen-soft:#E3EDF6;
  --mark:#FFE486; --ruled:#DCE4EC;
  --right:#2E7A50; --right-soft:#E4F1E8;
  --wrong:#B2453B; --wrong-soft:#F8E6E3;
  --warm:#F0A030; --warm-soft:#FDF0DC;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(43,42,38,.06), 0 8px 24px -12px rgba(43,42,38,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Sarabun',system-ui,sans-serif;background:#DFD9CC;color:var(--ink);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 120px}

.frame{width:var(--dev,390px);height:820px;max-height:calc(100vh - 56px);
  background:var(--paper);border-radius:22px;overflow-y:auto;overflow-x:hidden;position:relative;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.35);border:1px solid rgba(43,42,38,.12);scrollbar-width:thin}
.screen{min-height:100%;display:flex;flex-direction:column}

/* ── เปลือกแอป (ล็อกรอบ 2) ─────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--paper-3);padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:-.2px}
.brand small{color:var(--ink-3);font-weight:500}
.spacer{flex:1}
.quota{font-size:12.5px;color:var(--pen);background:var(--pen-soft);padding:4px 10px;
  border-radius:999px;font-weight:600;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--paper-3);display:grid;
  place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);flex:none}

.focusbar{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.94);backdrop-filter:blur(8px);
  padding:12px 16px 10px;border-bottom:1px solid var(--paper-3)}
.focusrow{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.focusrow .lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.focusrow .timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.focusrow .timer.hot{color:var(--wrong)}
.xbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--paper-3);background:transparent;
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;flex:none}
.track{height:5px;background:var(--paper-3);border-radius:999px;overflow:hidden}
.track > i{display:block;height:100%;background:var(--pen);border-radius:999px}

.tabs{position:sticky;bottom:0;z-index:20;margin-top:auto;background:rgba(250,247,240,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--paper-3);display:grid;
  grid-template-columns:repeat(4,1fr);padding:6px 4px 8px}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:5px 2px;color:var(--ink-3);font-size:11px;font-family:inherit}
.tab .ic{font-size:17px;line-height:1}
.tab.on{color:var(--pen);font-weight:600}

main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}

/* ── การ์ด + โจทย์ (ล็อกรอบ 3) ─────────────────────────────── */
.card{background:#fff;border:1px solid var(--paper-3);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 16px}
.card.flat{background:var(--paper-2);box-shadow:none}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);font-weight:500}
.pill.lv{background:var(--mark);color:#5A4A10;font-weight:600}
.pill.goal{background:var(--pen-soft);color:var(--pen);font-weight:600}
.qtext{font-size:17px;line-height:1.62;font-weight:500}
.qtext .fx{font-family:'Cambria Math',Georgia,serif;font-style:italic;font-size:1.06em;padding:0 2px}

.choices{display:flex;flex-direction:column;gap:8px;margin-top:15px}
.ch{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
  font-size:15px;line-height:1.5;color:var(--ink);background:#fff;border:1.5px solid var(--paper-3);
  border-radius:var(--r-sm);padding:11px 13px;cursor:pointer;transition:.14s}
.ch .k{width:26px;height:26px;border-radius:50%;background:var(--paper-2);display:grid;
  place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.ch .tx{flex:1}
.ch.sel{border-color:var(--pen);background:var(--pen-soft)}
.ch.sel .k{background:var(--pen);color:#fff}

/* ── ปุ่ม ────────────────────────────────────────────────────── */
.btn{font-family:inherit;font-size:15px;font-weight:600;border-radius:var(--r-sm);padding:13px 18px;
  cursor:pointer;border:1.5px solid transparent;transition:.14s}
.btn.primary{background:var(--pen);color:#fff}
.btn.primary:disabled{background:var(--paper-3);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--paper-3);color:var(--ink-2)}
.btn.warm{background:var(--warm);color:#3B2A08}
.btn.full{width:100%}
.btn.sm{font-size:13.5px;padding:9px 13px}
.btnrow{display:flex;gap:10px}

/* ── ชิ้นส่วนเฉพาะรอบนี้ ───────────────────────────────────── */
/* แถบเลขข้อ (question palette) */
.palette{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none;
  border-bottom:1px solid var(--paper-3);background:rgba(250,247,240,.94)}
.palette::-webkit-scrollbar{display:none}
.pnum{flex:none;width:31px;height:31px;border-radius:8px;border:1.5px solid var(--paper-3);
  background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.pnum.done{background:var(--paper-3);color:var(--ink-2);border-color:var(--paper-3)}
.pnum.now{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
.pnum.flag{border-color:var(--warm);color:var(--warm);background:var(--warm-soft)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.pgrid .pnum{width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:11px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* segmented / ตัวเลือกฟอร์ม */
.seg{display:grid;grid-auto-flow:column;gap:0;border:1.5px solid var(--paper-3);
  border-radius:var(--r-sm);overflow:hidden;background:#fff}
.seg button{font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 6px;border:0;
  background:transparent;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--paper-3)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pen);color:#fff}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--paper-3)}
.frow:last-child{border-bottom:0}
.frow .lb{font-size:14.5px;font-weight:500}
.frow .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.sw{width:44px;height:25px;border-radius:999px;background:var(--pen);position:relative;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:#fff}
.sw.off{background:var(--paper-3)}
.sw.off::after{right:auto;left:3px}

/* สถิติ / ผลสอบ */
.bigscore{text-align:center;padding:22px 16px 18px}
.bigscore .n{font-size:52px;font-weight:700;line-height:1;letter-spacing:-1.5px}
.bigscore .n small{font-size:20px;color:var(--ink-3);font-weight:500}
.bigscore .cap{font-size:13.5px;color:var(--ink-2);margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1px solid var(--paper-3);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.bar .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar .top span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .t{height:7px;border-radius:999px;background:var(--paper-3);overflow:hidden}
.bar .t > i{display:block;height:100%;border-radius:999px;background:var(--pen)}
.bar.low .t > i{background:var(--wrong)}
.bar.mid .t > i{background:var(--warm)}
.bar.high .t > i{background:var(--right)}

/* band โอกาสติด */
.band{border-radius:var(--r);padding:18px 16px;background:var(--warm-soft);border:1px solid #F0DDBC}
.band .lvl{font-size:26px;font-weight:700;letter-spacing:-.5px}
.band .gap{font-size:14px;color:var(--ink-2);line-height:1.6;margin-top:6px}
.meter{display:flex;gap:4px;margin-top:13px}
.meter i{flex:1;height:8px;border-radius:999px;background:var(--paper-3)}
.meter i.on{background:var(--warm)}

/* timeline ช่วง (sprint) */
.legs{display:flex;align-items:center;gap:0;margin:2px 0 4px}
.leg{flex:1;text-align:center;position:relative}
.leg .dot{width:26px;height:26px;border-radius:50%;background:var(--paper-3);color:var(--ink-3);
  display:grid;place-items:center;font-size:12px;font-weight:600;margin:0 auto 6px;position:relative;z-index:1}
.leg.done .dot{background:var(--right);color:#fff}
.leg.now .dot{background:var(--pen);color:#fff}
.leg small{font-size:11.5px;color:var(--ink-3)}
.leg::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--paper-3)}
.leg:first-child::before{display:none}
.leg.done::before,.leg.now::before{background:var(--right)}

/* สนามสอบ / ห้อง */
.codebox{display:flex;gap:7px;justify-content:center;margin:4px 0 2px}
.codebox i{width:40px;height:50px;border-radius:var(--r-sm);border:1.5px solid var(--paper-3);
  background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;font-style:normal}
.codebox i.empty{color:var(--ink-3);border-style:dashed}
.people{display:flex;flex-direction:column;gap:9px}
.person{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--paper-3)}
.person:last-child{border-bottom:0}
.person b{font-size:14.5px;font-weight:500;flex:1}
.person .st{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.person .st.ok{color:var(--right);font-weight:600}
.rank{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--paper-3)}
.rank:last-child{border-bottom:0}
.rank .no{width:22px;font-size:14px;font-weight:700;color:var(--ink-3);text-align:center;flex:none}
.rank.me{background:var(--pen-soft);margin:0 -16px;padding:11px 16px;border-radius:var(--r-sm);border-bottom:0}
.rank.me .no{color:var(--pen)}
.rank b{flex:1;font-size:14.5px;font-weight:500}
.rank .sc{font-weight:700;font-variant-numeric:tabular-nums}
.livebar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--pen-soft);
  border-bottom:1px solid #D3E2EF;overflow-x:auto;scrollbar-width:none}
.livebar::-webkit-scrollbar{display:none}
.friend{display:flex;align-items:center;gap:6px;flex:none;font-size:11.5px;color:var(--pen)}
.friend .avatar{width:22px;height:22px;font-size:10px;background:#fff}

.rowcards{display:grid;gap:11px}
.rowcard{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--paper-3);
  border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);text-align:left}
.rowcard .ic{width:38px;height:38px;border-radius:11px;background:var(--paper-2);display:grid;
  place-items:center;font-size:18px;flex:none}
.rowcard b{display:block;font-size:15px;margin-bottom:2px}
.rowcard span{font-size:12.5px;color:var(--ink-3)}
.sec{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;margin:4px 0 -4px}
.lead{font-size:14px;line-height:1.66;color:var(--ink-2)}
h2.t{font-size:21px;letter-spacing:-.3px}
h3.t{font-size:16.5px}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center}
.stick{position:sticky;bottom:0;margin:auto -16px -16px;padding:13px 16px 16px;
  background:rgba(250,247,240,.97);backdrop-filter:blur(8px);border-top:1px solid var(--paper-3)}

/* ── ตัวเลือกดีไซน์ ─────────────────────────────────────────── */
#picker{position:fixed;right:18px;bottom:18px;z-index:999;width:300px;background:#25231F;
  color:#EDE8DE;border-radius:14px;padding:12px 13px 13px;box-shadow:0 20px 50px -12px rgba(0,0,0,.55);
  font-size:12.5px;user-select:none}
#picker .head{display:flex;align-items:center;gap:8px;cursor:grab;margin-bottom:10px}
#picker .head b{font-size:13px;flex:1}
#picker .arrow{width:26px;height:26px;border-radius:7px;border:1px solid #4A463E;background:#332F29;
  color:#EDE8DE;cursor:pointer;font-size:13px;line-height:1}
#picker .name{font-size:14.5px;font-weight:700;margin-bottom:3px}
#picker .desc{color:#A79F91;line-height:1.55;margin-bottom:11px;font-size:11.8px;min-height:48px}
#picker .row{margin-bottom:9px}
#picker .row > label{display:block;color:#8E877B;font-size:10.5px;letter-spacing:.5px;margin-bottom:5px}
#picker .chips{display:flex;flex-wrap:wrap;gap:5px}
#picker .chip{border:1px solid #45413A;background:#332F29;color:#CFC8BB;border-radius:7px;
  padding:5px 9px;cursor:pointer;font-family:inherit;font-size:11.5px}
#picker .chip.on{background:#EDE8DE;color:#25231F;border-color:#EDE8DE;font-weight:600}
#picker .chip:disabled{opacity:.28;cursor:not-allowed}
</style>
</head>
<body style="--dev:390px">

<div class="frame"><div class="screen" id="app"></div></div>

<div id="picker">
  <div class="head" id="drag">
    <b>รอบ 4 · Mock + สนามสอบ</b>
    <button class="arrow" onclick="cycle(-1)">←</button>
    <button class="arrow" onclick="cycle(1)">→</button>
  </div>
  <div class="name" id="pName"></div>
  <div class="desc" id="pDesc"></div>
  <div class="row"><label>ดีไซน์</label><div class="chips" id="cV"></div></div>
  <div class="row"><label>ขั้นตอน</label><div class="chips" id="cP"></div></div>
  <div class="row" style="margin-bottom:0"><label>อุปกรณ์</label><div class="chips" id="cD"></div></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   ล็อกแล้ว: การ์ด+แท็บล่าง · โหมดโฟกัสตอนสอบ · ตัวเลือกปุ่มเต็มบรรทัด
             Mock = เลือกก่อน กดส่ง ไม่เฉลยจนจบ
   รอบ 4 ต่างกันที่: ตั้งค่า mock · การเดินข้อ · การส่ง · หน้าผล · สนามสอบ
   ════════════════════════════════════════════════════════════ */

const VARIANTS = [
  { id:'exam', name:'A · เหมือนห้องสอบจริง',
    desc:'ตั้งค่าเองครบ · ระหว่างสอบมีแถบเลขข้อ กระโดดได้ ปักธงไว้กลับมาดู · มีหน้าตรวจทานก่อนส่ง · ผลสอบเทียบเปอร์เซ็นไทล์' },
  { id:'lite', name:'B · เรียบ เดินหน้าอย่างเดียว',
    desc:'ระบบจัดชุดให้เลย กดเริ่มได้ทันที · เดินหน้าทีละข้อ ย้อนได้ข้อเดียว · ส่งแล้วจบ · ผลสอบเหลือใบเดียว เน้นว่าต้องซ่อมอะไรต่อ' },
  { id:'goal', name:'C · เป้าหมายเป็นตัวตั้ง',
    desc:'เริ่มจากคณะที่อยากติด ระบบจัดชุดให้ตรงสัดส่วนข้อสอบจริง · ระหว่างสอบเห็นคณะเป้าหมายค้างไว้ · ผลสอบเป็นแถบโอกาสติด + ห่างเป้าเท่าไร' },
  { id:'leg',  name:'D · ซ้อมเป็นช่วง',
    desc:'หั่น 30 ข้อเป็น 3 ช่วง ช่วงละ 10 ข้อ พักได้ระหว่างช่วง · เห็น timeline ตลอด · ผลสอบเทียบความแม่นและความเร็วรายช่วง' },
  { id:'live', name:'E · สนามแข่งสด',
    desc:'Mock กับสนามสอบเป็นอันเดียวกัน · ระหว่างสอบเห็นว่าเพื่อนทำถึงข้อไหน · จบแล้วขึ้นอันดับในห้องทันที' },
];

const STEPS = [
  { id:'setup',  label:'ตั้งค่า'   },
  { id:'exam',   label:'กำลังสอบ'  },
  { id:'submit', label:'ก่อนส่ง'   },
  { id:'result', label:'ผลสอบ'     },
  { id:'lobby',  label:'สนามสอบ'   },
  { id:'room',   label:'ในห้อง'    },
];
const DEVS = [['390px','มือถือ 390'],['834px','iPad 834'],['1200px','Desktop']];

/* ── ข้อความ: BASE + override ต่อดีไซน์ ────────────────────── */
const BASE = {
  setupH:'ซ้อมสอบเสมือนจริง',
  setupP:'ทำครบชุดในเวลาที่กำหนด ระบบจะประเมินจุดที่ควรซ่อมให้หลังส่ง',
  start:'เริ่มทำข้อสอบ',
  submit:'ส่งคำตอบ',
  submitH:'ตรวจทานก่อนส่ง',
  submitP:'เมื่อส่งแล้วจะไม่สามารถกลับมาแก้ไขได้',
  resultH:'ผลการซ้อมสอบ',
  again:'ซ้อมอีกครั้ง',
  fix:'ไปซ่อมจุดอ่อน',
  lobbyH:'สนามสอบ',
  lobbyP:'ชวนเพื่อนมาทำชุดข้อสอบเดียวกัน แล้วเทียบผลกันหลังจบ',
  create:'สร้างห้องสอบ',
  join:'เข้าร่วมด้วยรหัส',
  roomH:'ห้องสอบ 4KQ2ZP',
  roomStart:'เริ่มพร้อมกัน',
};
const COPY = {
  exam:{ setupP:'กำหนดวิชา จำนวนข้อ และเวลาเอง ให้ตรงกับสนามสอบที่จะไปเจอ',
         resultH:'ผลการซ้อมสอบ · เทียบกับผู้สอบทั้งหมด' },
  lite:{ setupH:'พร้อมซ้อมแล้ว', setupP:'ระบบจัดชุดให้จากหัวข้อที่ยังทำได้ไม่คงที่ กดเริ่มได้เลย',
         start:'เริ่มเลย', submitH:'ส่งคำตอบหรือยัง', submitP:'ยังเหลืออีก 2 ข้อที่ยังไม่ได้ตอบ',

function palette(cur, flags, done, cols){
  const n = S.v==='leg' ? 10 : 30;

}

/* ── เรนเดอร์ + ตัวเลือกดีไซน์ ─────────────────────────────── */
function render(){
  document.body.dataset.v = S.v;
  document.body.style.setProperty('--dev', S.dev);
  document.getElementById('app').innerHTML = R[S.step]();
  document.querySelector('.frame').scrollTop = 0;
  const now = document.querySelector('.palette .pnum.now');
  if(now) now.scrollIntoView({block:'nearest', inline:'center'});
  paintPicker();
}
function chips(el,list,cur,fn){
  el.innerHTML = list.map(([v,l])=>`<button class="chip${v===cur?' on':''}" data-v="${v}">${l}</button>`).join('');
  [...el.children].forEach(c=>c.onclick=()=>{ fn(c.dataset.v); render(); });
}
function paintPicker(){
  const v = VARIANTS.find(x=>x.id===S.v);
  pName.textContent = v.name; pDesc.textContent = v.desc;
  chips(cV, VARIANTS.map(x=>[x.id,x.name.split(' · ')[0]]), S.v, x=>S.v=x);
  chips(cP, STEPS.map(x=>[x.id,x.label]), S.step, x=>S.step=x);
  chips(cD, DEVS, S.dev, x=>S.dev=x);
}
function cycle(d){
  const i = VARIANTS.findIndex(x=>x.id===S.v);
  S.v = VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].id;
  render();
}
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') cycle(1);
  if(e.key==='ArrowLeft')  cycle(-1);
});
(function(){
  const p = picker, h = drag; let dx=0,dy=0,on=false;
  h.onmousedown = e=>{ on=true; const r=p.getBoundingClientRect();
    dx=e.clientX-r.left; dy=e.clientY-r.top; h.style.cursor='grabbing'; };
  addEventListener('mousemove', e=>{ if(!on) return;
    p.style.left=(e.clientX-dx)+'px'; p.style.top=(e.clientY-dy)+'px';
    p.style.right='auto'; p.style.bottom='auto'; });
  addEventListener('mouseup', ()=>{ on=false; h.style.cursor='grab'; });
})();
render();
</script>
