<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — TCAS AI · ทิศทางดีไซน์ทั้งเว็บ (รอบ 1)</title>
<!--
  PROTOTYPE — THROWAWAY. ห้าม merge เข้า production
  คำถามของรอบนี้: "ทั้งเว็บควรมีทิศทางดีไซน์ + น้ำเสียงข้อความแบบไหน"
  5 ทิศทางที่ต่างกันแบบคนละเรื่อง สลับด้วยลูกศร ←/→ หรือ picker มุมขวาล่าง (ลากได้)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Kanit:wght@300;400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;600;700&family=Noto+Serif+Thai:wght@400;600;700&family=Sarabun:wght@200;300;400;600&family=Mali:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   0. RESET + TOKENS (ค่า default = ดีไซน์ปัจจุบัน Paper & Pencil)
   ══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; }

:root {
  --paper:#FBFAF6; --panel:#F3EFE6; --ruled:#E7E1D4;
  --ink:#18223B; --soft:#5C6479; --accent:#2F5BFF; --accent2:#1E40AF;
  --mark:#FFDC4A; --good:#166534; --bad:#DC2626; --graphite:#C7C0B0;
  --font:'Bai Jamjuree',system-ui,sans-serif;
  --font-head:'Bai Jamjuree',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:16px; --radius-sm:12px; --radius-pill:999px;
  --card-bg:#FBFAF6; --card-border:1px solid var(--ruled); --card-shadow:0 1px 2px rgba(24,34,59,.05);
  --btn-radius:999px; --h1-size:2.6rem; --h1-weight:700; --h1-spacing:-.01em;
  --body-size:.95rem; --shell-max:1100px; --page-pad:96px;
}

body {
  background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: var(--body-size); line-height: 1.55; min-height: 100vh;
  -webkit-font-smoothing: antialiased; transition: background .25s, color .25s;
}
a { color: inherit; text-decoration: none; }

/* ── ดีไซน์ 1 · Paper & Pencil (ของเดิม ขยายทั้งเว็บ) ─────────── */
body[data-design="paper"] {
  --font:'Bai Jamjuree',sans-serif; --font-head:'Bai Jamjuree',sans-serif;
}
body[data-design="paper"] .surface-hero {
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom,transparent 0,transparent 37px,#ECE6D8 37px,#ECE6D8 38px);
  background-position: 0 8px;
}

/* ── ดีไซน์ 2 · Arena (สนามแข่ง / เกม / มืด) ─────────────────── */
body[data-design="arena"] {
  --paper:#0B0D14; --panel:#141824; --ruled:#242B3D;
  --ink:#F2F4FA; --soft:#8E97AE; --accent:#00E4A0; --accent2:#00B37E;
  --mark:#FF3D71; --good:#00E4A0; --bad:#FF3D71; --graphite:#4A5268;
  --font:'Kanit',sans-serif; --font-head:'Kanit',sans-serif;
  --card-bg:#141824; --card-border:1px solid #242B3D;
  --card-shadow:0 0 0 1px rgba(0,228,160,.06), 0 18px 50px -24px rgba(0,228,160,.35);
  --radius:14px; --h1-size:3rem; --h1-weight:700; --h1-spacing:-.02em; --btn-radius:10px;
}
body[data-design="arena"] .surface-hero {
  background:
    radial-gradient(900px 420px at 78% -10%, rgba(0,228,160,.14), transparent 62%),
    radial-gradient(700px 380px at 8% 8%, rgba(255,61,113,.10), transparent 60%),
    #0B0D14;
}
body[data-design="arena"] .h1 { text-transform: none; }
body[data-design="arena"] .eyebrow { color: var(--accent); }

/* ── ดีไซน์ 3 · Cockpit (แดชบอร์ดข้อมูลแน่น + sidebar) ────────── */
body[data-design="cockpit"] {
  --paper:#F7F8FA; --panel:#FFFFFF; --ruled:#E3E7EE;
  --ink:#111827; --soft:#6B7280; --accent:#4338CA; --accent2:#312E81;
  --mark:#FDE68A; --good:#047857; --bad:#B91C1C; --graphite:#9CA3AF;
  --font:'IBM Plex Sans Thai',sans-serif; --font-head:'IBM Plex Sans Thai',sans-serif;
  --card-bg:#FFFFFF; --card-border:1px solid #E3E7EE; --card-shadow:none;
  --radius:8px; --radius-sm:6px; --btn-radius:6px;
  --h1-size:1.75rem; --h1-weight:600; --h1-spacing:-.01em; --body-size:.875rem;
  --shell-max:1240px; --page-pad:40px;
}
body[data-design="cockpit"] .surface-hero { background: #FFFFFF; }

/* ── ดีไซน์ 4 · Zen (โฟกัสสุดขั้ว น้อยแต่มาก) ────────────────── */
body[data-design="zen"] {
  --paper:#FFFFFF; --panel:#FAFAFA; --ruled:#EAEAEA;
  --ink:#0A0A0A; --soft:#737373; --accent:#0A0A0A; --accent2:#000000;
  --mark:#FFE500; --good:#0A0A0A; --bad:#C4342B; --graphite:#BDBDBD;
  --font:'Sarabun',sans-serif; --font-head:'Noto Serif Thai',serif;
  --card-bg:transparent; --card-border:none; --card-shadow:none;
  --radius:0px; --radius-sm:0px; --btn-radius:0px;
  --h1-size:3.4rem; --h1-weight:400; --h1-spacing:-.03em;
  --body-size:1rem; --shell-max:720px; --page-pad:120px;
}
body[data-design="zen"] .surface-hero { background:#fff; }

/* ── ดีไซน์ 5 · Buddy (เพื่อนติว สดใส มือถือมาก่อน) ──────────── */
body[data-design="buddy"] {
  --paper:#FFF8F3; --panel:#FFEFE4; --ruled:#FFD9C2;
  --ink:#3B2417; --soft:#9C6B4E; --accent:#FF6B3D; --accent2:#E64A19;
  --mark:#FFD166; --good:#12A594; --bad:#E5484D; --graphite:#D9B79E;
  --font:'Mali',cursive; --font-head:'Mali',cursive;
  --card-bg:#FFFFFF; --card-border:2px solid #FFD9C2;
  --card-shadow:0 6px 0 0 #FFD9C2;
  --radius:24px; --radius-sm:18px; --btn-radius:999px;
  --h1-size:2.2rem; --h1-weight:700; --h1-spacing:0;
  --shell-max:560px; --page-pad:72px;
}
body[data-design="buddy"] .surface-hero { background: linear-gradient(180deg,#FFEFE4 0%, #FFF8F3 100%); }

/* ══════════════════════════════════════════════════════════════
   1. โครงร่วม
   ══════════════════════════════════════════════════════════════ */
.shell { max-width: var(--shell-max); margin: 0 auto; padding: 0 24px; }
.page { padding-top: var(--page-pad); padding-bottom: 88px; min-height: 100vh; }
.eyebrow {
  font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--soft);
}
.h1 { font-family: var(--font-head); font-size: var(--h1-size); font-weight: var(--h1-weight);
      letter-spacing: var(--h1-spacing); line-height: 1.12; }
.h2 { font-family: var(--font-head); font-size: calc(var(--h1-size) * .62); font-weight: var(--h1-weight);
      letter-spacing: var(--h1-spacing); line-height: 1.2; }
.h3 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 600; }
.muted { color: var(--soft); }
.mono { font-family: var(--font-mono); }
.card { background: var(--card-bg); border: var(--card-border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 26px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--paper); font-weight: 600; font-size: .9rem;
  padding: 13px 26px; border-radius: var(--btn-radius); transition: transform .12s, background .2s, box-shadow .2s;
}
.btn:hover { background: var(--accent2); }
.btn:active { transform: translateY(1px); }
.btn-ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.btn-ghost:hover { background: var(--accent); color: var(--paper); }
.mark { background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 94%, transparent 94%); padding: 0 .1em; }
.row { display: flex; align-items: center; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 18px; }
@media (max-width: 820px) { .grid3, .grid2 { grid-template-columns: 1fr; } }

/* ปรับรายละเอียดต่อดีไซน์ */
body[data-design="zen"] .card { padding: 0; border-bottom: 1px solid var(--ruled); padding-bottom: 28px; }
body[data-design="zen"] .btn { border-bottom: 2px solid var(--accent); background: transparent; color: var(--ink);
  padding: 8px 0; border-radius: 0; font-weight: 400; }
body[data-design="zen"] .btn:hover { background: transparent; color: var(--soft); border-color: var(--soft); }
body[data-design="zen"] .eyebrow { font-family: var(--font); letter-spacing: .2em; }
body[data-design="arena"] .btn { box-shadow: 0 0 24px -6px var(--accent); color: #06110C; }
body[data-design="buddy"] .btn { box-shadow: 0 4px 0 0 var(--accent2); font-weight: 700; }
body[data-design="buddy"] .btn:active { box-shadow: 0 1px 0 0 var(--accent2); transform: translateY(3px); }
body[data-design="cockpit"] .card { padding: 18px 20px; }

/* ══════════════════════════════════════════════════════════════
   2. NAV (3 ทรง: บน / ข้าง / แท็บล่าง)
   ══════════════════════════════════════════════════════════════ */
.topnav {
  position: fixed; inset: 0 0 auto 0; height: 62px; z-index: 40;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--ruled);
}
.topnav .shell { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.navlinks { display: flex; gap: 26px; font-size: .85rem; }
.navlinks a { color: var(--soft); }
.navlinks a:hover, .navlinks a.on { color: var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; }
.brand i { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px;
  border-radius: 999px; background: var(--accent); color: var(--paper); font-size: .62rem; font-style: normal; font-weight: 700; }

.sidenav {
  position: fixed; inset: 0 auto 0 0; width: 216px; z-index: 40;
  background: var(--panel); border-right: 1px solid var(--ruled); padding: 18px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidenav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm);
  font-size: .85rem; color: var(--soft); }
.sidenav a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--ink); }
.sidenav a.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 600; }
.sidenav .brand { padding: 6px 12px 20px; }
.sidenav .sidefoot { margin-top: auto; border-top: 1px solid var(--ruled); padding-top: 14px; font-size: .75rem; color: var(--soft); }

.tabnav {
  position: fixed; inset: auto 0 0 0; z-index: 40; background: var(--card-bg);
  border-top: 2px solid var(--ruled); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tabnav a { flex: 1; text-align: center; font-size: .68rem; color: var(--soft); padding: 4px 0; }
.tabnav a b { display: block; font-size: 1.15rem; line-height: 1.4; font-weight: 400; }
.tabnav a.on { color: var(--accent); font-weight: 700; }

body[data-nav="side"] .topnav, body[data-nav="side"] .tabnav { display: none; }
body[data-nav="side"] .app { padding-left: 216px; }
body[data-nav="side"] .page { padding-top: 34px; }
body[data-nav="top"] .sidenav, body[data-nav="top"] .tabnav { display: none; }
body[data-nav="tabs"] .sidenav, body[data-nav="tabs"] .topnav { display: none; }
body[data-nav="tabs"] .page { padding-bottom: 108px; }
body[data-design="zen"] .topnav { background: transparent; backdrop-filter: none; border-bottom: none; }
body[data-design="zen"] .navlinks { gap: 20px; font-size: .78rem; letter-spacing: .04em; }

/* ══════════════════════════════════════════════════════════════
   3. ชิ้นส่วนเฉพาะแอป
   ══════════════════════════════════════════════════════════════ */
/* ── ตัวเลือกคำตอบ 5 ทรง ── */
.choices { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 13px 16px; border: 2px solid var(--ruled); border-radius: var(--radius-sm); transition: .15s; }
.choice:hover { border-color: var(--accent); }
.choice .bub { flex: none; width: 28px; height: 28px; border-radius: 999px; border: 2px solid currentColor;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: .72rem; font-weight: 600; }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.choice.right .bub { background: var(--good); color: #fff; border-color: var(--good); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad); }
.choice.wrong .bub { background: var(--bad); color: #fff; border-color: var(--bad); }
.choice.dim { opacity: .45; }

/* arena: การ์ด 2 คอลัมน์เรืองแสง */
body[data-design="arena"] .choices { display: grid; grid-template-columns: 1fr 1fr; }
body[data-design="arena"] .choice { flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px;
  background: rgba(255,255,255,.02); }
body[data-design="arena"] .choice:hover { box-shadow: 0 0 22px -8px var(--accent); }
body[data-design="arena"] .choice .bub { border-radius: 8px; }
/* cockpit: แถวแน่น + คีย์ลัด */
body[data-design="cockpit"] .choices { gap: 6px; }
body[data-design="cockpit"] .choice { padding: 9px 12px; border-width: 1px; }
body[data-design="cockpit"] .choice .bub { width: 22px; height: 22px; border-radius: 4px; border-width: 1px; font-size: .68rem; }
/* zen: ไม่มีกรอบ เป็นบรรทัด */
body[data-design="zen"] .choice { border: none; border-bottom: 1px solid var(--ruled); border-radius: 0;
  padding: 16px 2px; font-size: 1.05rem; }
body[data-design="zen"] .choice:hover { background: var(--panel); }
body[data-design="zen"] .choice .bub { border: none; color: var(--soft); font-family: var(--font-head); }
body[data-design="zen"] .choice.right { background: transparent; border-bottom-color: var(--ink); }
body[data-design="zen"] .choice.right .bub { background: transparent; color: var(--ink); }
/* buddy: ปุ่มอ้วนกลม */
body[data-design="buddy"] .choice { border-radius: 999px; padding: 14px 18px; box-shadow: 0 3px 0 0 var(--ruled); background: #fff; }
body[data-design="buddy"] .choice:hover { transform: translateY(-2px); }

/* ── แถบสถานะ/สถิติ ── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-pill);
  font-family: var(--font-mono); font-size: .72rem; font-weight: 600;
  background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
body[data-design="zen"] .pill { background: transparent; border-bottom: 1px solid var(--ruled); border-radius: 0; padding: 2px 0; color: var(--soft); }
.statnum { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 700; line-height: 1; }
body[data-design="zen"] .statnum { font-family: var(--font-head); font-weight: 400; }
.bar { height: 6px; border-radius: 999px; background: var(--ruled); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.dots { display: flex; gap: 5px; }
.dots span { width: 8px; height: 8px; border-radius: 999px; background: var(--ruled); }
.dots span.done { background: var(--good); } .dots span.now { background: var(--accent); }

.field { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--ruled);
  padding: 10px 2px; color: var(--ink); outline: none; }
.field:focus { border-color: var(--accent); }
body[data-design="cockpit"] .field, body[data-design="buddy"] .field, body[data-design="arena"] .field {
  border: var(--card-border); border-radius: var(--radius-sm); padding: 11px 14px; background: var(--panel); }

.kbd { font-family: var(--font-mono); font-size: .66rem; border: 1px solid var(--ruled); border-radius: 4px;
  padding: 1px 5px; color: var(--soft); margin-left: auto; }

/* ══════════════════════════════════════════════════════════════
   4. PICKER (ลากได้ · ไม่ใช่ส่วนหนึ่งของดีไซน์)
   ══════════════════════════════════════════════════════════════ */
#picker {
  position: fixed; right: 20px; bottom: 20px; z-index: 999; width: 306px;
  background: #0f1117; color: #fff; border-radius: 14px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.55);
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; user-select: none; overflow: hidden;
  border: 1px solid #2a2f3d;
}
#picker .hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #171a23; cursor: grab; }
#picker .hd.drag { cursor: grabbing; }
#picker .hd b { font-size: 10px; letter-spacing: .14em; color: #7d8699; font-weight: 400; }
#picker .hd .x { margin-left: auto; color: #7d8699; cursor: pointer; padding: 0 4px; }
#picker .bd { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
#picker .cyc { display: flex; align-items: center; gap: 10px; }
#picker .cyc button { width: 30px; height: 30px; border-radius: 8px; background: #232838; color: #fff; font-size: 14px; }
#picker .cyc button:hover { background: #323a52; }
#picker .name { flex: 1; text-align: center; }
#picker .name b { display: block; font-size: 13px; color: #fff; font-family: 'Bai Jamjuree', sans-serif; }
#picker .name span { font-size: 10px; color: #7d8699; }
#picker .lbl { font-size: 9px; letter-spacing: .16em; color: #5d6577; margin-bottom: 5px; }
#picker .chips { display: flex; flex-wrap: wrap; gap: 5px; }
#picker .chips button { padding: 5px 9px; border-radius: 7px; background: #232838; color: #aeb6c8; font-size: 11px; }
#picker .chips button.on { background: #4f7cff; color: #fff; }
#picker .hint { font-size: 10px; color: #5d6577; line-height: 1.5; border-top: 1px solid #232838; padding-top: 9px; }
#picker.min .bd { display: none; }
</style>
</head>
<body data-design="paper" data-nav="top">

<div class="app" id="app"></div>

<div id="picker">
  <div class="hd"><b>◇ PROTOTYPE PICKER</b><span class="x" id="pk-min">—</span></div>
  <div class="bd">
    <div class="cyc">
      <button id="pk-prev">←</button>
      <div class="name"><b id="pk-name"></b><span id="pk-desc"></span></div>
      <button id="pk-next">→</button>
    </div>
    <div><div class="lbl">หน้า</div><div class="chips" id="pk-pages"></div></div>
    <div id="pk-states-wrap"><div class="lbl">สถานะ</div><div class="chips" id="pk-states"></div></div>
    <div class="hint">←/→ = สลับดีไซน์ · ทั้งหน้าเปลี่ยนทั้งหน้าตาและข้อความ · ลากหัวเพื่อย้าย</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ดีไซน์ 5 ทิศทาง — ต่างกันทั้ง layout, จังหวะ, และ "น้ำเสียง" ข้อความ
   ══════════════════════════════════════════════════════════════ */
const BASE = {
  brand:'TCAS', nav:['ฝึกโจทย์','สนามสอบ','Mock Test','ราคา'],
  navIcons:['✎','⚔','◷','◆'],
  heroEyebrow:'AI PRACTICE · TCAS 69',
  heroCardLabel:'กระดาษคำตอบ',
  heroTitle:'เตรียมสอบ TCAS\nให้ <span class="mark">ตรงจุด</span>',

const RENDER = {landing, practice, mock, social, pricing, login};

/* ── รันเนอร์ ─────────────────────────────────────────────── */
function render(){
  const d = DESIGNS[state.d];
  document.body.dataset.design = d.id;
  document.body.dataset.nav = d.nav;
  document.getElementById('app').innerHTML = nav() + RENDER[state.page]();
  window.scrollTo(0,0);
  // picker
  document.getElementById('pk-name').textContent = d.name;
  document.getElementById('pk-desc').textContent = d.desc;
  document.getElementById('pk-pages').innerHTML = PAGES.map(p=>
    `<button class="${p.id===state.page?'on':''}" onclick="go('${p.id}')">${p.label}</button>`).join('');
  const pg = PAGES.find(p=>p.id===state.page);
  const wrap = document.getElementById('pk-states-wrap');
  if (pg && pg.states) {
    wrap.style.display = '';
    document.getElementById('pk-states').innerHTML = pg.states.map(([s,l])=>
      `<button class="${state.st[pg.id]===s?'on':''}" onclick="setSt('${pg.id}','${s}')">${l}</button>`).join('');
  } else wrap.style.display = 'none';
}
function go(p){ state.page = p; render(); }
function setSt(p,s){ state.st[p] = s; render(); }
function cycle(n){ state.d = (state.d + n + DESIGNS.length) % DESIGNS.length; render(); }

document.getElementById('pk-prev').onclick = ()=>cycle(-1);
document.getElementById('pk-next').onclick = ()=>cycle(1);
document.getElementById('pk-min').onclick = ()=>document.getElementById('picker').classList.toggle('min');
addEventListener('keydown', e=>{
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
// drag
(function(){
  const p = document.getElementById('picker'), h = p.querySelector('.hd');
  let dx=0, dy=0, on=false;
  h.addEventListener('pointerdown', e=>{
    on = true; h.classList.add('drag'); h.setPointerCapture(e.pointerId);
    const r = p.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    p.style.right='auto'; p.style.bottom='auto'; p.style.left=r.left+'px'; p.style.top=r.top+'px';
  });
  h.addEventListener('pointermove', e=>{ if(!on) return;
    p.style.left = Math.max(0,Math.min(innerWidth-p.offsetWidth, e.clientX-dx))+'px';
    p.style.top  = Math.max(0,Math.min(innerHeight-40, e.clientY-dy))+'px'; });
  h.addEventListener('pointerup', ()=>{ on=false; h.classList.remove('drag'); });
})();
addEventListener('resize', ()=>{});
render();
</script>
